filebeat.inputs:
  - type: filestream
    id: workhub-server-json-log
    enabled: true
    paths:
      - /var/log/workhub-server/workhub-server.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields:
      app.name: workhub-server
      event.dataset: workhub-server.log
    fields_under_root: true

processors:
  - add_host_metadata: {}
  - add_docker_metadata: {}

setup.ilm.enabled: false
setup.template.name: workhub-logs
setup.template.pattern: workhub-logs-*
setup.kibana:
  host: http://kibana:5601

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "workhub-logs-%{+yyyy.MM.dd}"
