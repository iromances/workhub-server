server:
  port: 8080

spring:
  application:
    name: workhub-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    druid:
      url: jdbc:mysql://10.10.116.133:3306/workhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: amp_pre_%^888
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 0
      min-idle: 0
      max-active: 20
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  file:
    name: logs/workhub-server.log
  level:
    root: INFO
    cn.aslight.workhub: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.mybatis: WARN
    com.alibaba.druid: WARN

workhub:
  jwt:
    secret: workhub-dev-secret-workhub-dev-secret
    expiration-minutes: 720
  wecom:
    robot:
      enabled: false
      webhook:
  reminder:
    enabled: false
    due-soon-hours: 24
    dedupe-minutes: 60
    cron: "0 */30 * * * *"
  ai:
    provider: heuristic
    openrouter:
      enabled: false
      api-key:
      base-url: https://openrouter.ai/api/v1
      model: openai/gpt-4o-mini
      referer: http://127.0.0.1:8080
      title: WorkHub Server
    minimax:
      enabled: false
      api-key:
      base-url: https://api.minimaxi.com/v1
      model: M2-her
    codex-cli:
      enabled: true
      command: codex
      model: gpt-5.3-codex
      reasoning-effort: low
      timeout-seconds: 0
      disable-plugins: true
  storage:
    local-path: data/uploads
