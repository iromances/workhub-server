server:
  port: 8080

spring:
  application:
    name: workhub-server
  config:
    import: optional:file:.workhub-secrets.properties
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    druid:
      url: jdbc:mysql://aslight.cn:30364/workhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: workhub
      password: 'workhub123!@#'
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 0
      min-idle: 0
      max-active: 20
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${spring.datasource.druid.url}
    user: ${spring.datasource.druid.username}
    password: ${spring.datasource.druid.password}
    locations: classpath:db/schema/mysql
    fail-on-missing-locations: true
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: current schema baseline
    clean-disabled: true
    out-of-order: false
    placeholder-replacement: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  file:
    name: ${WORKHUB_LOG_FILE:logs/workhub-server.log}
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${WORKHUB_OBSERVABILITY_ENV:local}
  logback:
    rollingpolicy:
      max-file-size: ${WORKHUB_LOG_MAX_FILE_SIZE:50MB}
      max-history: ${WORKHUB_LOG_MAX_HISTORY:14}
      total-size-cap: ${WORKHUB_LOG_TOTAL_SIZE_CAP:1GB}
  level:
    root: INFO
    cn.aslight.workhub: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.mybatis: WARN
    com.alibaba.druid: WARN

workhub:
  ops:
    elk-alert:
      enabled: ${WORKHUB_ELK_ALERT_ENABLED:false}
      base-url: ${WORKHUB_ELK_BASE_URL:}
      index-pattern: ${WORKHUB_ELK_INDEX_PATTERN:workhub-logs-*}
      api-key: ${WORKHUB_ELK_API_KEY:}
      username: ${WORKHUB_ELK_USERNAME:}
      password: ${WORKHUB_ELK_PASSWORD:}
      connect-timeout-seconds: ${WORKHUB_ELK_CONNECT_TIMEOUT_SECONDS:5}
      request-timeout-seconds: ${WORKHUB_ELK_REQUEST_TIMEOUT_SECONDS:30}
      page-size: ${WORKHUB_ELK_PAGE_SIZE:200}
      initial-lookback-minutes: ${WORKHUB_ELK_INITIAL_LOOKBACK_MINUTES:5}
      pit-keep-alive: ${WORKHUB_ELK_PIT_KEEP_ALIVE:1m}
      cron: "${WORKHUB_ELK_ALERT_CRON:0 * * * * *}"
    accounting:
      enabled: ${WORKHUB_ACCOUNTING_SCHEDULE_ENABLED:false}
      cron: "${WORKHUB_ACCOUNTING_SCHEDULE_CRON:0 30 6 * * *}"
      zone: ${WORKHUB_ACCOUNTING_SCHEDULE_ZONE:Asia/Shanghai}
  jwt:
    secret: workhub-dev-secret-workhub-dev-secret
    expiration-minutes: 720
  wecom:
    robot:
      enabled: false
      webhook:
  reminder:
    enabled: false
    due-soon-hours: 24
    dedupe-minutes: 60
    cron: "0 */30 * * * *"
  ai:
    master-key: ${WORKHUB_AI_MASTER_KEY:}
    codex-cli:
      enabled: true
  storage:
    local-path: data/uploads
  payment:
    master-key: workhub-payment-dev-master-key
    mask-visible-suffix: 4
  mcp:
    master-key: ${WORKHUB_MCP_MASTER_KEY:workhub-mcp-dev-master-key}
    access-token: ${WORKHUB_MCP_ACCESS_TOKEN:}
