<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkHub AI 接入配置连通性测试 Demo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#273142;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.dialog{width:920px;max-width:calc(100vw - 32px);margin:28px auto;background:#fff;border:1px solid #dfe4eb;box-shadow:0 14px 38px rgba(28,39,55,.14)}.title,.footer{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}.title{border-bottom:1px solid #e8ebf0}.footer{gap:16px;border-top:1px solid #e8ebf0}.content{padding:18px 20px 20px}.row,.grid{display:grid;gap:14px}.row{grid-template-columns:2fr 1fr 1fr;margin-bottom:16px}.grid{grid-template-columns:repeat(3,1fr)}label{display:block;color:#5b6675;font-size:12px;margin-bottom:6px}input,select{width:100%;height:34px;border:1px solid #cfd6df;padding:0 10px;background:#fff}.tabs{display:flex;border:1px solid #dfe4eb;border-bottom:0}.tab{border:0;border-right:1px solid #dfe4eb;background:#f7f8fa;padding:11px 18px;cursor:pointer}.tab.active{background:#fff;color:#1f6fd1;box-shadow:inset 0 2px #1f6fd1}.tag{margin-left:6px;padding:1px 5px;color:#14804a;background:#e9f7ef;font-size:11px}.panel{border:1px solid #dfe4eb}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #eef0f3;background:#f8fafc}.head strong{display:block}.hint,.result{color:#8590a0;font-size:12px}.body{padding:16px}.notice{margin-top:14px;padding:9px 11px;border-left:3px solid #d9a514;background:#fff9e8;color:#6f5b1d;font-size:12px}.footer-left,.footer-right{display:flex;align-items:center;gap:10px}.result.success{color:#176b3b}.result.error{color:#a6312a}button.action{height:32px;border:1px solid #aeb8c5;background:#fff;padding:0 14px;cursor:pointer}button.primary{background:#1f6fd1;border-color:#1f6fd1;color:#fff}button:disabled{cursor:wait;opacity:.65}.switch{color:#14804a}
  </style>
</head>
<body>
  <div class="dialog">
    <div class="title"><strong>编辑接入配置</strong><span>×</span></div>
    <div class="content">
      <div class="row"><div><label>接入名称</label><input value="OpenAI 直连"></div><div><label>接入供应商</label><select><option>直连</option></select></div><div><label>模型厂商</label><select><option>OpenAI</option></select></div></div>
      <div class="tabs"><button class="tab active" data-tab="api">API 通道 <span class="tag">启用</span></button><button class="tab" data-tab="cli">CLI 通道 <span class="tag">启用</span></button></div>
      <section id="api" class="panel"><div class="head"><div><strong>API 通道</strong><span class="hint">协议、Base URL、API Key 和超时配置</span></div><span class="switch">● 已启用</span></div><div class="body"><div class="grid"><div><label>API 协议</label><select><option>OPENAI_RESPONSES</option></select></div><div><label>Base URL</label><input value="https://api.openai.com/v1"></div><div><label>API Key</label><input value="**********1234"></div><div><label>默认模型</label><select><option>gpt-5.6-sol</option></select></div><div><label>推理强度</label><select><option>HIGH</option></select></div><div><label>总调用超时</label><input value="600"></div></div><div class="notice">使用当前尚未保存的表单参数发起一次最小真实调用，可能产生少量费用。</div></div></section>
      <section id="cli" class="panel" hidden><div class="head"><div><strong>CLI 通道</strong><span class="hint">CLI 命令、工作目录和超时配置</span></div><span class="switch">● 已启用</span></div><div class="body"><div class="grid"><div><label>CLI 命令</label><input value="codex"></div><div><label>工作目录</label><input value="/workspace/workhub-server"></div><div><label>默认模型</label><select><option>gpt-5.6-sol</option></select></div><div><label>推理强度</label><select><option>HIGH</option></select></div><div><label>默认速度</label><select><option>STANDARD</option></select></div><div><label>总调用超时</label><input value="1800"></div></div><div class="notice">CLI 使用受限结构化调用；模型列表刷新告警不直接判定为失败。</div></div></section>
    </div>
    <div class="footer"><div class="footer-left"><button id="test" class="action">测试连通性</button><span id="result" class="result">测试会发起一次真实模型调用</span></div><div class="footer-right"><button class="action">取消</button><button class="action primary">保存</button></div></div>
  </div>
  <script>
    const states={api:null,cli:null};let active='api';const result=document.getElementById('result');const test=document.getElementById('test');
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{active=tab.dataset.tab;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));document.querySelectorAll('.panel').forEach(panel=>panel.hidden=panel.id!==active);render()});
    function render(){const state=states[active];result.className=`result ${state?.type||''}`;result.textContent=state?.message||'测试会发起一次真实模型调用'}
    test.onclick=()=>{const label=active==='cli'?'CLI':'API';test.disabled=true;states[active]={type:'',message:`${label} 通道测试中，请稍候…`};render();setTimeout(()=>{const ok=Math.random()>.25;states[active]={type:ok?'success':'error',message:ok?`✓ ${label} 通道连接成功，耗时 826ms`:`✕ ${label} 通道连接失败：请检查当前通道配置`};test.disabled=false;render()},900)};
  </script>
</body>
</html>
