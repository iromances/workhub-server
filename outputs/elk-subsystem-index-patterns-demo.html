<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>关注子系统多索引配置 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #303133; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 28px rgb(0 0 0 / 8%); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .desc { margin: 0 0 24px; color: #909399; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, select { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 6px; outline: none; }
    input:focus, select:focus { border-color: #409eff; }
    .section { margin-top: 20px; }
    .pattern-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
    button { height: 36px; padding: 0 16px; border: 0; border-radius: 6px; cursor: pointer; }
    .primary { background: #409eff; color: white; }
    .plain { border: 1px solid #409eff; background: white; color: #409eff; }
    .danger { border: 1px solid #f56c6c; background: white; color: #f56c6c; }
    .footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .tip { margin-top: 8px; color: #909399; font-size: 12px; }
    .error { min-height: 21px; margin-top: 8px; color: #f56c6c; }
    pre { display: none; margin-top: 20px; padding: 16px; overflow: auto; border-radius: 8px; background: #1f2329; color: #d8dee9; }
  </style>
</head>
<body>
<main>
  <h1>新增关注子系统</h1>
  <p class="desc">业务线下的每个子系统可以维护多个 Elasticsearch 索引模式。</p>
  <div class="grid">
    <div><label>业务线</label><select id="businessLine"><option value="BL000001">保费分期</option></select></div>
    <div><label>环境</label><select id="environment"><option value="prod">生产</option><option value="test">测试</option></select></div>
    <div><label>子系统名称</label><input id="subsystemName" value="保费系统"></div>
    <div><label>服务名</label><input id="serviceName" value="amp-saps"></div>
  </div>
  <div class="section">
    <label>日志索引模式</label>
    <div id="patterns"></div>
    <button class="plain" id="add">添加索引模式</button>
    <div class="tip">最多 20 个；重复值提交时自动去重，采集时按顺序合并查询。</div>
    <div class="error" id="error"></div>
  </div>
  <div class="footer"><button class="primary" id="save">保存并预览请求</button></div>
  <pre id="preview"></pre>
</main>
<script>
  const patterns = document.querySelector('#patterns')
  const error = document.querySelector('#error')
  const preview = document.querySelector('#preview')
  function addPattern(value = '') {
    if (patterns.children.length >= 20) return
    const row = document.createElement('div')
    row.className = 'pattern-row'
    row.innerHTML = `<input value="${value}" placeholder="例如 amp-saps-*"><button class="danger">删除</button>`
    row.querySelector('button').onclick = () => {
      if (patterns.children.length === 1) row.querySelector('input').value = ''
      else row.remove()
    }
    patterns.appendChild(row)
  }
  addPattern('amp-saps-*')
  addPattern('amp-saps-history-*')
  document.querySelector('#add').onclick = () => addPattern()
  document.querySelector('#save').onclick = () => {
    const values = [...patterns.querySelectorAll('input')].map(item => item.value.trim()).filter(Boolean)
    const unique = [...new Set(values)]
    if (!unique.length) {
      error.textContent = '请至少填写一个日志索引模式'
      preview.style.display = 'none'
      return
    }
    error.textContent = values.length === unique.length ? '' : '已自动移除重复索引模式'
    preview.textContent = JSON.stringify({
      businessLineCode: document.querySelector('#businessLine').value,
      environmentCode: document.querySelector('#environment').value,
      subsystemName: document.querySelector('#subsystemName').value.trim(),
      serviceName: document.querySelector('#serviceName').value.trim(),
      indexPatterns: unique,
      enabled: true
    }, null, 2)
    preview.style.display = 'block'
  }
</script>
</body>
</html>
