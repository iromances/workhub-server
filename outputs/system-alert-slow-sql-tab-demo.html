<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统预警分类与过滤规则 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #f4f7fb; color: #172033; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { max-width: 1280px; margin: auto; padding: 24px; border: 1px solid #e5eaf2; border-radius: 12px; background: #fff; box-shadow: 0 8px 30px rgba(15, 23, 42, .05); }
    .tab-toolbar { display: flex; align-items: flex-start; gap: 16px; }
    button { padding: 8px 15px; border: 1px solid #d8dee9; border-radius: 7px; background: #fff; color: #344054; cursor: pointer; }
    button.primary { border-color: #409eff; background: #409eff; color: #fff; }
    .tabs { display: flex; flex: 1; gap: 24px; border-bottom: 1px solid #e5eaf2; }
    .tab { padding: 12px 2px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: #667085; }
    .tab.active { border-bottom-color: #409eff; color: #409eff; font-weight: 600; }
    .subtabs { display: flex; gap: 20px; margin: 2px 0 16px; border-bottom: 1px solid #e5eaf2; }
    .subtab { padding: 10px 2px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: #667085; }
    .subtab.active { border-bottom-color: #409eff; color: #409eff; font-weight: 600; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    select, input { min-width: 150px; padding: 9px 10px; border: 1px solid #d8dee9; border-radius: 7px; color: #344054; background: #fff; }
    input { min-width: 270px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .metric { padding: 16px; border: 1px solid #e5eaf2; border-radius: 9px; }
    .metric span { display: block; color: #667085; font-size: 13px; }
    .metric strong { display: block; margin-top: 4px; font-size: 28px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #eef1f6; text-align: left; }
    th { color: #667085; background: #fafbfc; font-weight: 600; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #fef0f0; color: #f56c6c; font-size: 12px; }
    .tag.info { margin: 2px 4px 2px 0; background: #f4f4f5; color: #606266; }
    .tag.warning { background: #fdf6ec; color: #e6a23c; }
    .notice { margin: 18px 0; padding: 11px 14px; border: 1px solid #a0cfff; border-radius: 7px; background: #ecf5ff; color: #337ecc; }
    .section { margin: 20px 0 10px; font-weight: 700; }
    .hidden { display: none; }
    .tip { padding: 18px; border: 1px dashed #cdd5df; border-radius: 8px; color: #667085; }
    @media (max-width: 760px) { body { padding: 12px; } .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main class="card">
  <div class="tab-toolbar">
  <div class="tabs">
    <button class="tab active" data-panel="errors">系统异常</button>
    <button class="tab" data-panel="slow">慢 SQL</button>
    <button class="tab" data-panel="subsystems">关注子系统</button>
    <button class="tab" data-panel="rules">过滤规则</button>
  </div>
    <button onclick="alert('刷新当前页签')">刷新</button>
  </div>
  <section id="errors" class="panel"></section>
  <section id="slow" class="panel hidden"></section>
  <section id="subsystems" class="panel hidden">
    <div class="filters"><select><option>全部业务线</option></select><select><option>生产</option></select><button class="primary">查询</button><button>新增关注子系统</button></div>
    <div class="tip">关注子系统列表及原有新增、编辑、删除能力保持不变。</div>
  </section>
  <section id="rules" class="panel hidden">
    <div class="filters"><input placeholder="规则名称、关键词或备注" /><label><input type="checkbox" style="min-width:auto" /> 仅看启用</label><button class="primary">查询</button><button>新增过滤规则</button></div>
    <div class="notice">规则仅影响后续采集；优先级越小越先匹配，第一条命中后即停止。未命中规则的日志归入系统异常。</div>
    <table>
      <thead><tr><th>优先级</th><th>规则名称</th><th>处理动作</th><th>匹配范围</th><th>匹配方式</th><th>关键词</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td>10</td><td>JWT无效噪音</td><td><span class="tag info">忽略</span></td><td>消息正文</td><td>任一关键词</td><td><span class="tag info">拦截请求解析token异常：jwt无效</span></td><td>启用</td><td><a href="#">编辑</a> · <a href="#">删除</a></td></tr>
        <tr><td>100</td><td>Druid连接长时间未收包</td><td><span class="tag warning">归入慢 SQL</span></td><td>全部文本</td><td>任一关键词</td><td><span class="tag info">discard long time none received connection</span><span class="tag info">lastPacketReceivedIdleMillis</span></td><td>启用</td><td><a href="#">编辑</a> · <a href="#">删除</a></td></tr>
      </tbody>
    </table>
  </section>
</main>
<script>
  function dashboard(slow) {
    const message = slow ? 'discard long time none received connection ... lastPacketReceivedIdleMillis : 119987' : '支付回调处理失败';
    const eventLabel = slow ? '慢 SQL 事件' : '系统异常事件';
    const summary = `<div class="section">${slow ? '慢 SQL 汇总' : ''}</div><table><thead><tr><th>业务线</th><th>环境</th><th>子系统</th><th>服务名</th><th>数量</th><th>最近发生时间</th></tr></thead><tbody><tr><td>BL000001</td><td>prod</td><td>保费支付</td><td>scf-payment</td><td><span class="tag">${slow ? 6 : 18}</span></td><td>2026-08-05 17:20:31</td></tr></tbody></table>`;
    const events = `<div class="section">${slow ? `最近${eventLabel}` : ''}</div><table><thead><tr><th>发生时间</th><th>级别</th><th>子系统</th><th>服务名</th><th>异常消息</th><th>来源</th></tr></thead><tbody><tr><td>2026-08-05 17:20:31</td><td><span class="tag">ERROR</span></td><td>保费支付</td><td>scf-payment</td><td>${message}</td><td>ELK</td></tr></tbody></table>`;
    const detail = slow
      ? summary + events
      : `<div class="subtabs"><button class="subtab active" data-subpanel="error-events">最近系统异常事件</button><button class="subtab" data-subpanel="error-summary">系统异常汇总</button></div><section id="error-events" class="subpanel">${events}</section><section id="error-summary" class="subpanel hidden">${summary}</section>`;
    return `<div class="filters"><select><option>全部业务线</option></select><select><option>生产</option></select><select><option>全部子系统</option></select><select><option>ERROR</option></select><input value="最近 1 小时" /><button class="primary">查询</button></div>
      <div class="metrics"><div class="metric"><span>${eventLabel}</span><strong>${slow ? 6 : 18}</strong></div><div class="metric"><span>关注子系统</span><strong>12</strong></div><div class="metric"><span>命中子系统</span><strong>${slow ? 2 : 5}</strong></div></div>
      ${detail}`;
  }
  document.querySelector('#errors').innerHTML = dashboard(false);
  document.querySelector('#slow').innerHTML = dashboard(true);
  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(item => item.classList.add('hidden'));
    tab.classList.add('active');
    document.querySelector(`#${tab.dataset.panel}`).classList.remove('hidden');
  }));
  document.querySelectorAll('.subtab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.subtab').forEach(item => item.classList.remove('active'));
    document.querySelectorAll('.subpanel').forEach(item => item.classList.add('hidden'));
    tab.classList.add('active');
    document.querySelector(`#${tab.dataset.subpanel}`).classList.remove('hidden');
  }));
</script>
</body>
</html>
